<div class="signup-container">
  <h2>Sign Up</h2>

  <form [formGroup]="signupForm" (ngSubmit)="onSubmit()">

    <!-- Name -->
    <div>
      <label for="name">Full Name</label>
      <input id="name" type="text" formControlName="name">
      <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched">
        Name is required.
      </div>
    </div>

    <!-- Email -->
    <div>
      <label for="email">Email</label>
      <input id="email" type="email" formControlName="email">
      <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched">
        Enter a valid email.
      </div>
    </div>

    <!-- Role -->
    <div>
      <label for="role">Role</label>
      <select id="role" formControlName="role">
        <option value="">Select Role</option>
        <option *ngFor="let role of roles" [value]="role">{{ role }}</option>
      </select>
      <div *ngIf="signupForm.get('role')?.invalid && signupForm.get('role')?.touched">
        Role is required.
      </div>
    </div>

    <!-- Password -->
    <div>
      <label for="password">Password</label>
      <input id="password" type="password" formControlName="password">
      <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched">
        Password must be at least 6 characters.
      </div>
    </div>

    <!-- Confirm Password -->
    <div>
      <label for="conpassword">Confirm Password</label>
      <input id="conpassword" type="password" formControlName="conpassword">
      <div *ngIf="signupForm.get('conpassword')?.invalid && signupForm.get('conpassword')?.touched">
        Passwords must match.
      </div>
    </div>

    <button type="submit" [disabled]="signupForm.invalid">Sign Up</button>
  </form>
</div>
