<div class="container mt-4">
  <h3>User Management</h3>

  <div *ngIf="loading">Loading users...</div>

  <table class="table table-striped" *ngIf="!loading && users?.length">
    <thead>
      <tr>
        <th>#</th>
        <th>Name</th>
        <th>Email</th>
        <th>Role</th>
        <th>Change Role</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let u of users; let i = index">
        <td>{{ i + 1 }}</td>
        <td>{{ u.name }}</td>
        <td>{{ u.email }}</td>
        <td><strong>{{ u.role }}</strong></td>
        <td>
          <select class="form-select d-inline-block w-auto me-2"
                  [value]="u.role"
                  (change)="changeRole(u, $any($event.target).value)">
            <option *ngFor="let r of roles" [value]="r" [disabled]="u.email === currentAdminEmail && r !== u.role">
              {{ r }}
            </option>
          </select>
        </td>
      </tr>
    </tbody>
  </table>

  <div *ngIf="!loading && (!users || users.length === 0)">
    No users found.
  </div>
</div>
