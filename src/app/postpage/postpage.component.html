<!-- ✏️ Post Creation Form -->
<div class="container mt-5">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white">
      <h4>Create a Post</h4>
    </div>
    <div class="card-body">
      <form (ngSubmit)="onSubmit()">
        
        <!-- Title -->
        <div class="mb-3">
          <label class="form-label">Post Title</label>
          <input
            type="text"
            class="form-control"
            [(ngModel)]="post.postTitle"
            name="postTitle"
            placeholder="Enter post title">
        </div>

        <!-- ✅ Rich Text Editor -->
        <div class="mb-3">
          <label class="form-label">Post Content</label>
          <quill-editor
            [(ngModel)]="post.postContent"
            name="postContent"
            [modules]="editorModules"
            [styles]="{ height: '250px' }"
            placeholder="Write your post here with rich formatting...">
          </quill-editor>
        </div>

        <!-- Category -->
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select
            class="form-select"
            [(ngModel)]="post.postCategory"
            name="postCategory">
            <option selected disabled value="">Choose category</option>
            <option value="Technology">Technology</option>
            <option value="Education">Education</option>
            <option value="Lifestyle">Lifestyle</option>
            <option value="Sports">Sports</option>
            <option value="Other">Other</option>
          </select>
        </div>

        <div class="mb-3" *ngIf="post.postCategory === 'Other'">
          <label class="form-label">Custom Category</label>
          <input
            type="text"
            class="form-control"
            placeholder="Enter your own category"
            [(ngModel)]="customCategory"
            name="customCategory"
          />
        </div>
<div class="d-flex flex-column mb-3">
  <label class="form-label">Attachments</label>
  <input type="file" (change)="onFileSelected($event)" multiple>
  <div *ngIf="selectedFiles.length > 0">
    <small *ngFor="let file of selectedFiles" class="text-muted d-block">
      {{ file.name }}
    </small>
  </div>
</div>

        <div class="d-flex justify-content-end">
          <button type="reset" class="btn btn-secondary me-2">Reset</button>
         
          <button type="submit" class="btn btn-primary">Submit Post</button>
        </div>

      </form>
    </div>
  </div>
</div>
