<div class="container mt-4">
  <!-- Top Toolbar -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <label class="me-2 fw-bold">Category:</label>
    <select
      class="form-select d-inline-block w-auto"
      [(ngModel)]="selectedCategory"
      (change)="onCategoryChange(selectedCategory)"
    >
      <option value="">All</option>
      <option *ngFor="let c of categories" [value]="c">{{ c }}</option>
      <option value="Other">Other</option> <!-- ✅ add this -->
    </select>
  

  <!-- Custom category input -->
  <div *ngIf="selectedCategory === 'Other'">
    <input
      type="text"
      class="form-control d-inline-block w-auto"
      placeholder="Enter your own category"
      [(ngModel)]="customCategory"
      (keyup.enter)="onCategoryChange(customCategory)" 
    />
  </div>

    </div>

    <div>
      <a class="btn btn-primary" routerLink="postpage" *ngIf="isLoggedIn">+ Create Post</a>
      <a class="btn btn-outline-secondary" routerLink="/login" *ngIf="!isLoggedIn">Login</a>
    </div>
  </div>

  <!-- Messages -->
  <div *ngIf="loading" class="alert alert-info">Loading posts...</div>
  <div *ngIf="error" class="alert alert-danger">{{ error }}</div>

  <!-- Posts Grid -->
  <div class="row g-4">
    <div class="col-md-6" *ngFor="let p of posts">
      <div class="card post-card h-100 shadow-sm">
        
        <!-- Image (hidden now but ready) -->
        <!-- Uncomment when images are available
        <img [src]="p.imageUrl" class="card-img-top" alt="Post Image">
        -->

        <div class="card-body">
          <h5 class="card-title">
            <a [routerLink]="['/post', p.id]" class="text-decoration-none text-dark">{{ p.postTitle }}</a>
          </h5>

          <p class="text-muted small mb-1">
            By {{ p.authorEmail || 'Unknown' }} • {{ p.createdat | date:'medium' }}
          </p>

          <p class="card-text">{{ excerpt(p.postContent) }}</p>

          <a [routerLink]="['/post', p.id]" class="btn btn-sm btn-outline-primary">Read More</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-between align-items-center mt-4">
    <button class="btn btn-outline-secondary btn-sm" (click)="prev()" [disabled]="page===1">Prev</button>
    <span>Page {{ page }} of {{ totalPages }}</span>
    <button class="btn btn-outline-secondary btn-sm" (click)="next()" [disabled]="(page * pageSize) >= total">Next</button>
  </div>

</div>
